<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KiDelícia - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="login-main">
    <section id="login-section">
      <h2>Login do Administrador</h2>

      <form id="login-form">
        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Senha:</label>
        <input type="password" id="password" required>

        <button type="submit">Entrar</button>
      </form>

      <div id="login-feedback" class="error-message"></div>
    </section>
  </main>

  <script type="module">
    import { login } from './js/auth.js';

    const form = document.getElementById('login-form');
    const feedback = document.getElementById('login-feedback');
    const submitButton = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const senha = document.getElementById('password').value;

      submitButton.disabled = true;
      feedback.textContent = "Autenticando...";

      try {
        await login(email, senha);
        feedback.textContent = "Login realizado! Redirecionando...";
        window.location.href = "admin.html";
      } catch (err) {
        feedback.textContent = "Falha no login: " + err.message;
      } finally {
        submitButton.disabled = false;
      }
      console.log("login salvo em origin:", location.origin, "token:", localStorage.getItem('kidelicia_token'));
    });
  </script>

</body>
</html>
